# frpc xtcp example
serverAddr = "127.0.0.1"
serverPort = 7000
auth.method = "token"
auth.token = "12345678"
natHoleStunServer = "stun.easyvoip.com:3478"

log.to = "console"
log.level = "info"

# Role A: expose a local service (xtcp server / proxy)
[[proxies]]
name = "ssh"
type = "xtcp"
secretKey = "abcdefg"
localIP = "127.0.0.1"
localPort = 22
allowUsers = ["*"]

